plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.btremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.btremote"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
